# Worker specifier for the ZKNet anon-rpc worker (anon-rpc SPEC §4).
#
# The compiler settings below reproduce, byte for byte, the runtime code of the
# reference WorkerSpecifier that ethereum/anon-rpc deployed on Ethereum mainnet
# (codehash 0xc4c54384a9c1f1201ef3711a7ed7ba20e078a432e85ecc4f8b14927587cc7b5f).
# test/ReferenceBytecode.t.sol fails if any of them drifts, so they are pinned
# here rather than inherited from the Foundry defaults of the day.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
auto_detect_remappings = false
remappings = []
solc_version = "0.8.28"
evm_version = "prague"
optimizer = false
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true

[fuzz]
runs = 256

[lint]
# test/WorkerSpecifier.t.sol is a verbatim upstream copy (see NOTICE), kept
# byte-identical, so its style notes are not ours to fix.
ignore = ["test/WorkerSpecifier.t.sol"]
