# Promote a component's pre-release (release.yml) to a release: the manual
# step that moves an app's users to it. No release is ever GitHub's "latest":
# the desktop updater follows the app's own manifest, which this step will
# publish once its location is decided. See RELEASING.md.
name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to promote, e.g. desktop@0.1.0"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: The release, out of pre-release and never latest
        run: |
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'if .isDraft then error("still a draft: its build has not finished") else . end'
          gh release edit "$TAG" --prerelease=false --latest=false
      - name: The app's update manifest
        run: |
          echo "publish: not configured yet (the app-specific update manifest's location is being designed)"
          echo "the release's own manifest: $GITHUB_SERVER_URL/$GH_REPO/releases/download/$(jq -rn --arg t "$TAG" '$t|@uri')/latest.json"
