# Promote a component's release (release.yml) to the version its users get:
# release/promote, the same command a host runs. For the desktop client it
# publishes the release's latest.json to dist.zknet.io/updates/client/<channel>/;
# promoting to stable also takes the release out of pre-release (never
# latest). See RELEASING.md.
name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to promote, e.g. client@0.2.0"
        required: true
      channel:
        description: "The channel"
        type: choice
        options: [stable, beta]
        default: stable
      dry_run:
        description: "Check everything, write nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: release/promote "$TAG" --channel "$CHANNEL" $([ "$DRY_RUN" = true ] && echo --dry-run)
